<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" preserveAspectRatio="xMidYMid slice" role="img" aria-label="AI &amp; ML — neural network">
  <defs>
    <linearGradient id="aiMlBg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#1a1430"/>
      <stop offset="100%" stop-color="#070c17"/>
    </linearGradient>
    <radialGradient id="aiMlGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#ffb36a" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ff8a3d" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="280" fill="url(#aiMlBg)"/>
  <rect width="400" height="280" fill="url(#aiMlGlow)"/>
  <!-- Network -->
  <g stroke="#ff8a3d" stroke-width="1.2" opacity="0.55">
    <line x1="70" y1="80" x2="180" y2="60"/>
    <line x1="70" y1="80" x2="180" y2="140"/>
    <line x1="70" y1="80" x2="180" y2="220"/>
    <line x1="70" y1="200" x2="180" y2="60"/>
    <line x1="70" y1="200" x2="180" y2="140"/>
    <line x1="70" y1="200" x2="180" y2="220"/>
    <line x1="180" y1="60" x2="290" y2="100"/>
    <line x1="180" y1="60" x2="290" y2="180"/>
    <line x1="180" y1="140" x2="290" y2="100"/>
    <line x1="180" y1="140" x2="290" y2="180"/>
    <line x1="180" y1="220" x2="290" y2="100"/>
    <line x1="180" y1="220" x2="290" y2="180"/>
    <line x1="290" y1="100" x2="350" y2="140"/>
    <line x1="290" y1="180" x2="350" y2="140"/>
  </g>
  <!-- Nodes -->
  <g fill="#ffb36a">
    <circle cx="70" cy="80" r="9"/>
    <circle cx="70" cy="200" r="9"/>
    <circle cx="180" cy="60" r="10"/>
    <circle cx="180" cy="140" r="14" fill="#ff8a3d"/>
    <circle cx="180" cy="220" r="10"/>
    <circle cx="290" cy="100" r="9"/>
    <circle cx="290" cy="180" r="9"/>
    <circle cx="350" cy="140" r="12" fill="#ff8a3d"/>
  </g>
  <!-- Outer ring -->
  <circle cx="180" cy="140" r="22" fill="none" stroke="#ffb36a" stroke-width="1" stroke-dasharray="3 5" opacity="0.6"/>
</svg>
