<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Delivery — pipeline + rocket">
  <defs>
    <linearGradient id="dlvBg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0e2a22"/>
      <stop offset="100%" stop-color="#070c17"/>
    </linearGradient>
    <linearGradient id="dlvTrail" x1="0" x2="1">
      <stop offset="0%" stop-color="#74e8a2" stop-opacity="0"/>
      <stop offset="100%" stop-color="#74e8a2" stop-opacity="0.8"/>
    </linearGradient>
  </defs>
  <rect width="400" height="280" fill="url(#dlvBg)"/>
  <!-- Pipeline stages -->
  <g>
    <line x1="40" y1="140" x2="360" y2="140" stroke="rgba(141,239,176,0.25)" stroke-width="2"/>
    <line x1="40" y1="140" x2="320" y2="140" stroke="url(#dlvTrail)" stroke-width="3" stroke-linecap="round"/>
    <!-- Stage dots -->
    <g fill="#74e8a2">
      <circle cx="80" cy="140" r="8"/>
      <circle cx="160" cy="140" r="8"/>
      <circle cx="240" cy="140" r="8"/>
    </g>
    <circle cx="320" cy="140" r="14" fill="#8defb0"/>
    <circle cx="320" cy="140" r="22" fill="none" stroke="#8defb0" stroke-width="1.2" opacity="0.5"/>
    <!-- Stage labels -->
    <g font-family="ui-monospace, monospace" font-size="9" fill="#8defb0" opacity="0.85" text-anchor="middle">
      <text x="80" y="170">CODE</text>
      <text x="160" y="170">BUILD</text>
      <text x="240" y="170">TEST</text>
      <text x="320" y="170">SHIP</text>
    </g>
  </g>
  <!-- Arrow / rocket -->
  <g transform="translate(330 110) rotate(-12)">
    <path d="M 0 0 L 14 -6 L 14 6 Z" fill="#ffb36a"/>
  </g>
  <!-- Decorative tags -->
  <g font-family="ui-monospace, monospace" font-size="11" fill="#74e8a2" opacity="0.45">
    <text x="200" y="60" text-anchor="middle">git push origin main</text>
    <text x="200" y="230" text-anchor="middle">✓ deploy succeeded</text>
  </g>
</svg>
