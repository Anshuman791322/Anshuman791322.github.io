<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Languages — code brackets stack">
  <defs>
    <linearGradient id="langBg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0e1a30"/>
      <stop offset="100%" stop-color="#070c17"/>
    </linearGradient>
    <linearGradient id="langGlow" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#7db7ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#4a90ff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="400" height="280" fill="url(#langBg)"/>
  <rect width="400" height="280" fill="url(#langGlow)"/>
  <!-- Bracket stack -->
  <g font-family="ui-monospace, monospace" font-weight="700">
    <text x="60" y="80" font-size="48" fill="#7db7ff" opacity="0.5">&lt;/&gt;</text>
    <text x="160" y="125" font-size="60" fill="#ffb36a">{ }</text>
    <text x="270" y="170" font-size="52" fill="#7db7ff" opacity="0.7">( )</text>
    <text x="80" y="215" font-size="42" fill="#8ce5ff" opacity="0.5">[ ]</text>
    <text x="260" y="240" font-size="38" fill="#b29bff" opacity="0.6">; ;</text>
  </g>
</svg>
