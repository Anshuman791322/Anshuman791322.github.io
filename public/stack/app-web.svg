<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" preserveAspectRatio="xMidYMid slice" role="img" aria-label="App &amp; Web — browser + mobile frames">
  <defs>
    <linearGradient id="appBg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0d1d30"/>
      <stop offset="100%" stop-color="#070c17"/>
    </linearGradient>
  </defs>
  <rect width="400" height="280" fill="url(#appBg)"/>
  <!-- Browser frame -->
  <g transform="translate(50 60)">
    <rect width="220" height="160" rx="8" fill="#11233a" stroke="#7db7ff" stroke-width="1.4"/>
    <rect width="220" height="22" rx="8" fill="#1a3050"/>
    <rect y="14" width="220" height="8" fill="#1a3050"/>
    <circle cx="12" cy="11" r="3" fill="#ff5f57"/>
    <circle cx="24" cy="11" r="3" fill="#febc2e"/>
    <circle cx="36" cy="11" r="3" fill="#28c840"/>
    <!-- Layout boxes -->
    <rect x="14" y="36" width="192" height="20" rx="3" fill="rgba(125,183,255,0.18)"/>
    <rect x="14" y="62" width="92" height="42" rx="3" fill="rgba(125,183,255,0.12)"/>
    <rect x="114" y="62" width="92" height="42" rx="3" fill="rgba(125,183,255,0.12)"/>
    <rect x="14" y="110" width="192" height="14" rx="3" fill="rgba(125,183,255,0.1)"/>
    <rect x="14" y="130" width="120" height="14" rx="3" fill="rgba(255,138,61,0.3)"/>
  </g>
  <!-- Mobile frame overlapping -->
  <g transform="translate(255 95)">
    <rect width="80" height="140" rx="10" fill="#11233a" stroke="#ffb36a" stroke-width="1.4"/>
    <rect x="6" y="8" width="68" height="100" rx="3" fill="#0b1525"/>
    <circle cx="40" cy="118" r="6" fill="none" stroke="#ffb36a" stroke-width="1.4"/>
    <!-- Mini content -->
    <rect x="12" y="14" width="56" height="6" rx="2" fill="rgba(255,138,61,0.4)"/>
    <rect x="12" y="26" width="40" height="4" rx="1" fill="rgba(125,183,255,0.5)"/>
    <rect x="12" y="36" width="48" height="4" rx="1" fill="rgba(125,183,255,0.3)"/>
    <rect x="12" y="50" width="56" height="34" rx="3" fill="rgba(125,183,255,0.18)"/>
    <rect x="12" y="90" width="56" height="14" rx="3" fill="rgba(255,138,61,0.3)"/>
  </g>
</svg>
