      <text x="16" y="26" font-family="ui-monospace, monospace" font-size="10" letter-spacing="2" fill="#8ce5ff">LOCAL AI</text>
      <text x="16" y="54" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#ffffff">AI Agent</text>
      <text x="16" y="72" font-family="Inter, sans-serif" font-size="11" fill="#cbd5e1">PySide6 · Ollama · Whisper</text>

      <rect x="296" width="284" height="100" rx="12" fill="rgba(255,159,67,0.08)" stroke="rgba(255,159,67,0.24)"/>
      <text x="312" y="26" font-family="ui-monospace, monospace" font-size="10" letter-spacing="2" fill="#ffc188">VISION</text>
      <text x="312" y="54" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Driver Monitoring</text>
      <text x="312" y="72" font-family="Inter, sans-serif" font-size="11" fill="#cbd5e1">Android · APK · CV</text>
