<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Static portfolio systems — browser preview + editor pane">
  <defs>
    <linearGradient id="htmlBg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0d2238"/>
      <stop offset="100%" stop-color="#070c17"/>
    </linearGradient>
    <radialGradient id="htmlGlow" cx="50%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#8ce5ff" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#8ce5ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="htmlPreview" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0c1a2e"/>
      <stop offset="100%" stop-color="#070f1c"/>
    </linearGradient>
    <linearGradient id="htmlAccent" x1="0" x2="1">
      <stop offset="0%" stop-color="#8ce5ff"/>
      <stop offset="100%" stop-color="#bdf2ff"/>
    </linearGradient>
    <pattern id="htmlGrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="rgba(140,229,255,0.05)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="800" fill="url(#htmlBg)"/>
  <rect width="1280" height="800" fill="url(#htmlGrid)"/>
  <rect width="1280" height="800" fill="url(#htmlGlow)"/>

  <!-- Editor pane (back) -->
