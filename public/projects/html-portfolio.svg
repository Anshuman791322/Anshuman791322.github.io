  <!-- Floating tags -->
  <g font-family="ui-monospace, monospace" font-size="11" font-weight="700" letter-spacing="2">
    <rect x="60" y="60" width="166" height="28" rx="14" fill="rgba(140,229,255,0.14)" stroke="rgba(140,229,255,0.36)"/>
    <text x="76" y="78" fill="#bdf2ff">NEXT.JS · STATIC</text>
    <rect x="1058" y="60" width="160" height="28" rx="14" fill="rgba(140,229,255,0.14)" stroke="rgba(140,229,255,0.36)"/>
    <text x="1074" y="78" fill="#bdf2ff">VIEW-SOURCE OK</text>
