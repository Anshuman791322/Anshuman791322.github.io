      <text y="56" font-family="Inter, sans-serif" font-size="34" font-weight="800" fill="#ffffff">Software that feels</text>
      <text y="96" font-family="Inter, sans-serif" font-size="34" font-weight="800" fill="#ffffff">considered, shipped,</text>
      <text y="136" font-family="Inter, sans-serif" font-size="34" font-weight="800" fill="url(#htmlAccent)">and alive.</text>
      <text y="180" font-family="Inter, sans-serif" font-size="13" fill="#cbd5e1">A portfolio for local-first AI, computer vision,</text>
      <text y="200" font-family="Inter, sans-serif" font-size="13" fill="#cbd5e1">research notebooks, and front-end systems.</text>
      <!-- CTAs -->
