      <rect width="560" height="36" rx="0" fill="#0a1626"/>
      <text x="20" y="22" fill="#8ce5ff" font-family="ui-monospace, monospace" font-size="11" font-weight="700" letter-spacing="2">● BUILD READY · 118 KB FIRST LOAD</text>
      <text x="500" y="22" font-family="ui-monospace, monospace" font-size="11" fill="#7991b8">Ln 14</text>
