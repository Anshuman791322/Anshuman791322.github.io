      <rect width="580" height="92" rx="14" fill="rgba(140,229,255,0.08)" stroke="rgba(140,229,255,0.22)"/>
      <g font-family="Inter, sans-serif">
        <text x="32" y="42" font-size="28" font-weight="800" fill="#ffffff">5</text>
        <text x="32" y="64" font-size="10" font-family="ui-monospace, monospace" letter-spacing="2" fill="#8ce5ff">PUBLIC REPOS</text>
        <text x="172" y="42" font-size="28" font-weight="800" fill="#ffffff">4</text>
        <text x="172" y="64" font-size="10" font-family="ui-monospace, monospace" letter-spacing="2" fill="#8ce5ff">BUILD DOMAINS</text>
        <text x="332" y="42" font-size="28" font-weight="800" fill="#ffffff">2022</text>
        <text x="332" y="64" font-size="10" font-family="ui-monospace, monospace" letter-spacing="2" fill="#8ce5ff">BUILDING SINCE</text>
        <text x="476" y="42" font-size="28" font-weight="800" fill="#ffffff">100%</text>
        <text x="476" y="64" font-size="10" font-family="ui-monospace, monospace" letter-spacing="2" fill="#8ce5ff">OPEN SOURCE</text>
