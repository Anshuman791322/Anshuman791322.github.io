    <circle cx="42" cy="22" r="5" fill="#febc2e"/>
    <circle cx="62" cy="22" r="5" fill="#28c840"/>
    <text x="100" y="28" fill="#8ce5ff" font-family="ui-monospace, monospace" font-size="13" font-weight="700">app/page.tsx</text>
    <!-- Code -->
    <g transform="translate(28 78)" font-family="ui-monospace, monospace" font-size="13">
      <text y="0" fill="#5c7894">1</text>
      <text x="28" fill="#8ce5ff">import</text>
      <text x="86" fill="#cbd5e1">{ Hero }</text>
      <text x="160" fill="#8ce5ff">from</text>
      <text x="206" fill="#bdf2ff">"@/sections/Hero"</text>
      <text x="0" y="26" fill="#5c7894">2</text>
      <text x="28" y="26" fill="#8ce5ff">import</text>
      <text x="86" y="26" fill="#cbd5e1">{ Stack }</text>
      <text x="170" y="26" fill="#8ce5ff">from</text>
      <text x="216" y="26" fill="#bdf2ff">"@/sections/Stack"</text>
      <text x="0" y="52" fill="#5c7894">3</text>
      <text x="0" y="78" fill="#5c7894">4</text>
      <text x="28" y="78" fill="#ffc188">export default function</text>
      <text x="232" y="78" fill="#ffffff">Home</text>
      <text x="280" y="78" fill="#cbd5e1">() {</text>
      <text x="0" y="104" fill="#5c7894">5</text>
      <text x="28" y="104" fill="#bdf2ff">return</text>
      <text x="86" y="104" fill="#cbd5e1">(</text>
      <text x="0" y="130" fill="#5c7894">6</text>
      <text x="46" y="130" fill="#8ce5ff">&lt;main</text>
      <text x="106" y="130" fill="#ffc188">className</text>
      <text x="190" y="130" fill="#cbd5e1">=</text>
      <text x="200" y="130" fill="#bdf2ff">"shell"</text>
      <text x="252" y="130" fill="#8ce5ff">&gt;</text>
      <text x="0" y="156" fill="#5c7894">7</text>
      <text x="64" y="156" fill="#8ce5ff">&lt;Hero /&gt;</text>
      <text x="0" y="182" fill="#5c7894">8</text>
      <text x="64" y="182" fill="#8ce5ff">&lt;Stack /&gt;</text>
      <text x="0" y="208" fill="#5c7894">9</text>
      <text x="64" y="208" fill="#8ce5ff">&lt;SelectedWork /&gt;</text>
      <text x="0" y="234" fill="#5c7894">10</text>
      <text x="46" y="234" fill="#8ce5ff">&lt;/main&gt;</text>
      <text x="0" y="260" fill="#5c7894">11</text>
      <text x="28" y="260" fill="#cbd5e1">);</text>
      <text x="0" y="286" fill="#5c7894">12</text>
      <text x="0" y="286" fill="#cbd5e1">}</text>
      <text x="0" y="312" fill="#5c7894">13</text>
      <text x="0" y="338" fill="#5c7894">14</text>
      <text x="28" y="338" fill="#7991b8">// rendered statically · 0 KB JS</text>
    </g>
    <!-- Status bar -->
