<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Smart Driver Monitoring — Android dashboard with computer-vision HUD">
  <defs>
    <linearGradient id="drvBg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#1c150c"/>
      <stop offset="55%" stop-color="#11091c"/>
      <stop offset="100%" stop-color="#070c17"/>
    </linearGradient>
    <radialGradient id="drvHorizon" cx="50%" cy="22%" r="55%">
      <stop offset="0%" stop-color="#ff9f43" stop-opacity="0.36"/>
      <stop offset="100%" stop-color="#ff9f43" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="drvPhone" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#1a0f08"/>
      <stop offset="100%" stop-color="#0a0610"/>
    </linearGradient>
    <linearGradient id="drvBar" x1="0" x2="1">
      <stop offset="0%" stop-color="#ff9f43"/>
      <stop offset="100%" stop-color="#ffc188"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="800" fill="url(#drvBg)"/>
  <rect width="1280" height="800" fill="url(#drvHorizon)"/>

  <!-- Road perspective lines (background scene) -->
  <g stroke="#ff9f43" stroke-width="1.4" fill="none" opacity="0.32">
    <path d="M 60 760 L 640 360"/>
    <path d="M 1220 760 L 640 360"/>
    <path d="M 200 760 L 600 420"/>
    <path d="M 1080 760 L 680 420"/>
    <path d="M 320 760 L 610 460"/>
    <path d="M 960 760 L 670 460"/>
  </g>
  <g stroke="rgba(255,193,136,0.35)" stroke-width="1.2" stroke-dasharray="6 14">
    <line x1="640" y1="360" x2="640" y2="760"/>
  </g>

  <!-- Phone (driver dashboard) -->
  <g transform="translate(380 90)">
    <rect width="520" height="640" rx="38" fill="url(#drvPhone)" stroke="rgba(255,159,67,0.5)" stroke-width="2"/>
    <rect x="14" y="14" width="492" height="612" rx="28" fill="#0e0c19"/>
    <!-- Notch -->
    <rect x="220" y="22" width="80" height="20" rx="10" fill="#070c17"/>

    <!-- Status bar -->
    <g transform="translate(36 64)" font-family="ui-monospace, monospace" font-size="11" font-weight="700" letter-spacing="2" fill="#ffc188">
      <text>09:42</text>
      <text x="382">5G · 88%</text>
    </g>

    <!-- App title -->
    <g transform="translate(36 102)">
      <text font-family="Inter, sans-serif" font-size="22" font-weight="800" fill="#f4f6fb">Driver Monitor</text>
      <text x="0" y="22" font-family="ui-monospace, monospace" font-size="11" letter-spacing="2" fill="#a8a09b">● MONITORING · 60 FPS</text>
    </g>

    <!-- Camera frame with reticle -->
    <g transform="translate(36 156)">
      <rect width="448" height="240" rx="18" fill="#0a0610" stroke="rgba(255,159,67,0.25)" stroke-width="1.4"/>
      <!-- Sketch of driver -->
      <g opacity="0.45">
        <circle cx="224" cy="116" r="58" fill="rgba(255,255,255,0.05)"/>
        <circle cx="224" cy="116" r="58" fill="none" stroke="rgba(255,193,136,0.42)" stroke-width="1.4"/>
        <!-- Shoulders -->
        <path d="M 100 240 C 140 200 180 188 224 188 C 268 188 308 200 348 240" fill="none" stroke="rgba(255,193,136,0.42)" stroke-width="1.4"/>
        <!-- Eyes -->
        <ellipse cx="200" cy="108" rx="12" ry="4" fill="#ffc188"/>
        <ellipse cx="248" cy="108" rx="12" ry="4" fill="#ffc188"/>
        <!-- Mouth -->
        <path d="M 206 138 Q 224 146 242 138" stroke="#ffc188" stroke-width="2" stroke-linecap="round" fill="none"/>
      </g>
      <!-- Reticle -->
      <g transform="translate(224 116)">
        <rect x="-72" y="-46" width="144" height="92" rx="10" fill="none" stroke="#ff9f43" stroke-width="2"/>
        <line x1="-72" y1="-46" x2="-58" y2="-46" stroke="#ff9f43" stroke-width="3"/>
        <line x1="-72" y1="-46" x2="-72" y2="-32" stroke="#ff9f43" stroke-width="3"/>
        <line x1="72" y1="-46" x2="58" y2="-46" stroke="#ff9f43" stroke-width="3"/>
        <line x1="72" y1="-46" x2="72" y2="-32" stroke="#ff9f43" stroke-width="3"/>
        <line x1="-72" y1="46" x2="-58" y2="46" stroke="#ff9f43" stroke-width="3"/>
        <line x1="-72" y1="46" x2="-72" y2="32" stroke="#ff9f43" stroke-width="3"/>
        <line x1="72" y1="46" x2="58" y2="46" stroke="#ff9f43" stroke-width="3"/>
        <line x1="72" y1="46" x2="72" y2="32" stroke="#ff9f43" stroke-width="3"/>
      </g>
      <!-- Telemetry overlay -->
      <g transform="translate(20 210)" font-family="ui-monospace, monospace" font-size="10" font-weight="700" letter-spacing="2" fill="#ffc188">
        <text>EAR 0.34</text>
        <text x="92">YAW -2°</text>
        <text x="180">MAR 0.18</text>
        <text x="280">OK · 04:18:22</text>
      </g>
    </g>

    <!-- Signal tiles -->
    <g transform="translate(36 416)">
      <g>
        <rect width="138" height="80" rx="14" fill="rgba(255,159,67,0.12)" stroke="rgba(255,159,67,0.34)"/>
        <text x="14" y="26" font-family="ui-monospace, monospace" font-size="10" letter-spacing="2" font-weight="700" fill="#ffc188">EYES</text>
        <text x="14" y="58" font-family="Inter, sans-serif" font-size="22" font-weight="800" fill="#f4f6fb">OPEN</text>
      </g>
      <g transform="translate(155 0)">
        <rect width="138" height="80" rx="14" fill="rgba(255,159,67,0.08)" stroke="rgba(255,159,67,0.22)"/>
        <text x="14" y="26" font-family="ui-monospace, monospace" font-size="10" letter-spacing="2" font-weight="700" fill="#ffc188">YAWN</text>
        <text x="14" y="58" font-family="Inter, sans-serif" font-size="22" font-weight="800" fill="#f4f6fb">NONE</text>
      </g>
      <g transform="translate(310 0)">
        <rect width="138" height="80" rx="14" fill="rgba(255,159,67,0.08)" stroke="rgba(255,159,67,0.22)"/>
        <text x="14" y="26" font-family="ui-monospace, monospace" font-size="10" letter-spacing="2" font-weight="700" fill="#ffc188">POSE</text>
        <text x="14" y="58" font-family="Inter, sans-serif" font-size="22" font-weight="800" fill="#f4f6fb">FOCUS</text>
      </g>
    </g>

    <!-- Status row -->
    <g transform="translate(36 516)">
      <text font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#ffc188">Safety score</text>
      <text x="0" y="18" font-family="ui-monospace, monospace" font-size="10" letter-spacing="2" fill="#a8a09b">LAST 10 MINUTES</text>
      <rect x="0" y="28" width="448" height="10" rx="5" fill="rgba(255,159,67,0.16)"/>
      <rect x="0" y="28" width="392" height="10" rx="5" fill="url(#drvBar)"/>
      <text x="408" y="36" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#f4f6fb">88</text>
    </g>

    <!-- Download CTA -->
    <g transform="translate(36 560)">
      <rect width="448" height="48" rx="14" fill="url(#drvBar)"/>
      <text x="224" y="30" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#1a0f04">Download v1.4.2 APK · 18.6 MB</text>
    </g>
  </g>

  <!-- Floating release tags -->
  <g font-family="ui-monospace, monospace" font-size="11" font-weight="700" letter-spacing="2">
    <rect x="60" y="60" width="150" height="28" rx="14" fill="rgba(255,159,67,0.16)" stroke="rgba(255,159,67,0.36)"/>
    <text x="76" y="78" fill="#ffc188">RELEASE · v1.4.2</text>
    <rect x="1066" y="60" width="146" height="28" rx="14" fill="rgba(255,159,67,0.16)" stroke="rgba(255,159,67,0.36)"/>
    <text x="1082" y="78" fill="#ffc188">SIGNED · OK</text>
    <rect x="60" y="710" width="200" height="28" rx="14" fill="rgba(255,159,67,0.12)" stroke="rgba(255,159,67,0.28)"/>
    <text x="76" y="728" fill="#ffc188">ANDROID 10+ · ARM64</text>
  </g>
</svg>
