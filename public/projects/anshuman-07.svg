<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Release discipline — GitHub releases timeline with CI runs">
  <defs>
    <linearGradient id="relBg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0e2222"/>
      <stop offset="100%" stop-color="#070c17"/>
    </linearGradient>
    <radialGradient id="relGlow" cx="50%" cy="22%" r="55%">
      <stop offset="0%" stop-color="#74e8a2" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#74e8a2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="relPanel" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#0d1f1e"/>
      <stop offset="100%" stop-color="#070c17"/>
    </linearGradient>
    <linearGradient id="relAccent" x1="0" x2="1">
      <stop offset="0%" stop-color="#74e8a2"/>
      <stop offset="100%" stop-color="#a8f0bd"/>
    </linearGradient>
    <pattern id="relGrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="rgba(116,232,162,0.05)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="800" fill="url(#relBg)"/>
  <rect width="1280" height="800" fill="url(#relGrid)"/>
  <rect width="1280" height="800" fill="url(#relGlow)"/>

  <!-- GitHub repo header -->
  <g transform="translate(140 100)">
    <rect width="1000" height="92" rx="18" fill="url(#relPanel)" stroke="rgba(116,232,162,0.28)" stroke-width="1.4"/>
    <!-- Repo icon -->
    <g transform="translate(28 28)">
      <rect width="38" height="38" rx="10" fill="rgba(116,232,162,0.18)"/>
      <path d="M 19 9 C 13 9 9 13 9 19 c 0 4 3 7 6 9 v -3 c -2 0 -3 -1 -3 -2 0 -1 1 -2 2 -2 v -1 c -2 0 -4 -1 -4 -4 0 -1 0 -2 1 -3 0 0 1 0 2 1 1 0 2 -1 3 -1 1 0 2 1 3 1 1 -1 2 -1 2 -1 1 1 1 2 1 3 0 3 -2 4 -4 4 v 1 c 1 0 2 1 2 2 0 1 -1 2 -3 2 v 3 c 3 -2 6 -5 6 -9 0 -6 -4 -10 -10 -10 z" fill="#74e8a2"/>
    </g>
    <g transform="translate(82 26)" font-family="Inter, sans-serif">
      <text fill="#cbd5e1" font-size="13">Anshuman791322 /</text>
      <text x="120" fill="#ffffff" font-size="18" font-weight="800">Anshuman791322.github.io</text>
      <text y="36" fill="#a8f0bd" font-size="12" font-family="ui-monospace, monospace" letter-spacing="2">PUBLIC · MIT · 63 DEPLOYMENTS</text>
    </g>
    <!-- Star/fork pills -->
    <g transform="translate(720 28)">
      <rect width="118" height="36" rx="10" fill="none" stroke="rgba(116,232,162,0.4)" stroke-width="1.2"/>
      <text x="14" y="24" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#a8f0bd">★ Star</text>
      <text x="76" y="24" font-family="ui-monospace, monospace" font-size="12" fill="#a8f0bd">14</text>
      <rect x="130" width="118" height="36" rx="10" fill="none" stroke="rgba(116,232,162,0.4)" stroke-width="1.2"/>
      <text x="144" y="24" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#a8f0bd">⑂ Fork</text>
      <text x="206" y="24" font-family="ui-monospace, monospace" font-size="12" fill="#a8f0bd">3</text>
    </g>
  </g>

  <!-- Release timeline -->
  <g transform="translate(140 218)">
    <text font-family="ui-monospace, monospace" font-size="11" letter-spacing="2" fill="#74e8a2" font-weight="700">RELEASES · 5 PUBLIC ARTIFACTS</text>
    <!-- Vertical line -->
    <line x1="22" y1="34" x2="22" y2="446" stroke="rgba(116,232,162,0.28)" stroke-width="2" stroke-dasharray="2 6"/>

    <!-- Release item 1 -->
    <g transform="translate(0 32)">
      <circle cx="22" cy="22" r="10" fill="#74e8a2"/>
      <rect x="60" width="940" height="78" rx="14" fill="url(#relPanel)" stroke="rgba(116,232,162,0.32)" stroke-width="1.4"/>
      <g transform="translate(80 18)" font-family="Inter, sans-serif">
        <text fill="#ffffff" font-size="16" font-weight="800">v1.4.2 · Driver Monitoring Dashboard</text>
        <text y="22" fill="#cbd5e1" font-size="13">Signed APK · 18.6 MB · arm64 · Android 10+</text>
        <text x="700" font-family="ui-monospace, monospace" font-size="11" letter-spacing="2" fill="#a8f0bd">3 DAYS AGO · ● LATEST</text>
        <g transform="translate(700 16)">
          <rect width="86" height="26" rx="6" fill="rgba(116,232,162,0.16)" stroke="rgba(116,232,162,0.36)"/>
          <text x="14" y="18" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#a8f0bd">SIGNED · OK</text>
        </g>
      </g>
    </g>

    <!-- Release item 2 -->
    <g transform="translate(0 130)">
      <circle cx="22" cy="22" r="8" fill="#a8f0bd"/>
      <rect x="60" width="940" height="68" rx="14" fill="url(#relPanel)" stroke="rgba(116,232,162,0.18)" stroke-width="1.4"/>
      <g transform="translate(80 14)" font-family="Inter, sans-serif">
        <text fill="#ffffff" font-size="15" font-weight="700">v0.4.0 · AI Agent (Ai-agent)</text>
        <text y="20" fill="#cbd5e1" font-size="13">Windows installer · 142 MB · Ollama + Whisper bundled</text>
        <text x="700" font-family="ui-monospace, monospace" font-size="11" letter-spacing="2" fill="#a8f0bd">2 WEEKS AGO</text>
      </g>
    </g>

    <!-- Release item 3 -->
    <g transform="translate(0 218)">
      <circle cx="22" cy="22" r="8" fill="#a8f0bd"/>
      <rect x="60" width="940" height="68" rx="14" fill="url(#relPanel)" stroke="rgba(116,232,162,0.18)" stroke-width="1.4"/>
      <g transform="translate(80 14)" font-family="Inter, sans-serif">
        <text fill="#ffffff" font-size="15" font-weight="700">v1.0.0 · Variable Stars classifier</text>
        <text y="20" fill="#cbd5e1" font-size="13">Notebook + model weights · 9.4k labelled samples</text>
        <text x="700" font-family="ui-monospace, monospace" font-size="11" letter-spacing="2" fill="#a8f0bd">2 MONTHS AGO</text>
      </g>
    </g>

    <!-- Release item 4 -->
    <g transform="translate(0 306)">
      <circle cx="22" cy="22" r="8" fill="#74e8a2" opacity="0.7"/>
      <rect x="60" width="940" height="68" rx="14" fill="url(#relPanel)" stroke="rgba(116,232,162,0.16)" stroke-width="1.4"/>
      <g transform="translate(80 14)" font-family="Inter, sans-serif">
        <text fill="#cbd5e1" font-size="15" font-weight="700">v3.2.0 · Portfolio (Anshuman791322.github.io)</text>
        <text y="20" fill="#94a3b8" font-size="13">Static export · 118 KB First Load JS · WCAG AA</text>
        <text x="700" font-family="ui-monospace, monospace" font-size="11" letter-spacing="2" fill="#a8f0bd" opacity="0.8">4 MONTHS AGO</text>
      </g>
    </g>

    <!-- CI runs strip -->
    <g transform="translate(0 396)">
      <text font-family="ui-monospace, monospace" font-size="11" letter-spacing="2" fill="#74e8a2" font-weight="700">RECENT CI · GITHUB ACTIONS</text>
      <g transform="translate(0 16)">
        <g>
          <rect width="218" height="56" rx="12" fill="rgba(116,232,162,0.08)" stroke="rgba(116,232,162,0.2)"/>
          <circle cx="22" cy="28" r="8" fill="#74e8a2"/>
          <text x="44" y="24" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#ffffff">build &amp; deploy</text>
          <text x="44" y="42" font-family="ui-monospace, monospace" font-size="11" fill="#a8f0bd">47s · success</text>
        </g>
        <g transform="translate(232 0)">
          <rect width="218" height="56" rx="12" fill="rgba(116,232,162,0.08)" stroke="rgba(116,232,162,0.2)"/>
          <circle cx="22" cy="28" r="8" fill="#74e8a2"/>
          <text x="44" y="24" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#ffffff">pages deploy</text>
          <text x="44" y="42" font-family="ui-monospace, monospace" font-size="11" fill="#a8f0bd">9s · success</text>
        </g>
        <g transform="translate(464 0)">
          <rect width="218" height="56" rx="12" fill="rgba(116,232,162,0.08)" stroke="rgba(116,232,162,0.2)"/>
          <circle cx="22" cy="28" r="8" fill="#ffc188"/>
          <text x="44" y="24" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#ffffff">release apk</text>
          <text x="44" y="42" font-family="ui-monospace, monospace" font-size="11" fill="#ffc188">3m 12s · queued</text>
        </g>
        <g transform="translate(696 0)">
          <rect width="218" height="56" rx="12" fill="rgba(116,232,162,0.08)" stroke="rgba(116,232,162,0.2)"/>
          <circle cx="22" cy="28" r="8" fill="#74e8a2"/>
          <text x="44" y="24" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#ffffff">lint &amp; test</text>
          <text x="44" y="42" font-family="ui-monospace, monospace" font-size="11" fill="#a8f0bd">22s · success</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Floating tags -->
  <g font-family="ui-monospace, monospace" font-size="11" font-weight="700" letter-spacing="2">
    <rect x="60" y="60" width="178" height="28" rx="14" fill="rgba(116,232,162,0.14)" stroke="rgba(116,232,162,0.36)"/>
    <text x="76" y="78" fill="#a8f0bd">GITHUB · RELEASES</text>
    <rect x="1042" y="60" width="178" height="28" rx="14" fill="rgba(116,232,162,0.14)" stroke="rgba(116,232,162,0.36)"/>
    <text x="1058" y="78" fill="#a8f0bd">DEPLOY · WORKFLOW</text>
  </g>
</svg>
