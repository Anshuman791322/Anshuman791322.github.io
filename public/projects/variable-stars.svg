<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Periodically Variable Stars — light-curve plot and classifier panel">
  <defs>
    <linearGradient id="varBg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#1a1633"/>
      <stop offset="60%" stop-color="#0d0c1f"/>
      <stop offset="100%" stop-color="#050617"/>
    </linearGradient>
    <radialGradient id="varGlow" cx="50%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#b29bff" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#b29bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="varStar" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#d8c6ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#b29bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="varCurve" x1="0" x2="1">
      <stop offset="0%" stop-color="#b29bff"/>
      <stop offset="100%" stop-color="#cfb8ff"/>
    </linearGradient>
    <pattern id="varGrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="rgba(178,155,255,0.06)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="800" fill="url(#varBg)"/>
  <rect width="1280" height="800" fill="url(#varGrid)"/>
  <rect width="1280" height="800" fill="url(#varGlow)"/>

  <!-- Background stars -->
  <g fill="#ffffff">
    <circle cx="120" cy="120" r="1.6" opacity="0.7"/>
    <circle cx="220" cy="80" r="1.1" opacity="0.5"/>
    <circle cx="340" cy="160" r="1.4" opacity="0.6"/>
    <circle cx="460" cy="100" r="1" opacity="0.4"/>
    <circle cx="980" cy="80" r="1.5" opacity="0.7"/>
    <circle cx="1080" cy="160" r="1.2" opacity="0.5"/>
    <circle cx="1180" cy="100" r="1.4" opacity="0.6"/>
    <circle cx="180" cy="660" r="1.5" opacity="0.6"/>
    <circle cx="1140" cy="700" r="1.3" opacity="0.5"/>
  </g>

  <!-- Variable star -->
  <g transform="translate(220 290)">
    <circle r="170" fill="url(#varStar)" opacity="0.65"/>
    <circle r="28" fill="#ffffff"/>
    <line x1="0" y1="-60" x2="0" y2="-38" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="60" x2="0" y2="38" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <line x1="-60" y1="0" x2="-38" y2="0" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <line x1="60" y1="0" x2="38" y2="0" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Notebook panel -->
  <g transform="translate(500 110)">
    <rect width="700" height="580" rx="22" fill="rgba(13,12,31,0.85)" stroke="rgba(178,155,255,0.36)" stroke-width="1.4"/>

    <!-- Title bar -->
    <rect width="700" height="46" rx="22" fill="rgba(178,155,255,0.1)"/>
    <rect y="22" width="700" height="24" fill="rgba(178,155,255,0.1)"/>
    <circle cx="22" cy="22" r="5" fill="#ff5f57"/>
    <circle cx="42" cy="22" r="5" fill="#febc2e"/>
    <circle cx="62" cy="22" r="5" fill="#28c840"/>
    <text x="100" y="28" fill="#cfb8ff" font-family="ui-monospace, monospace" font-size="13" font-weight="700">variable_stars.ipynb · cell [12]</text>

    <!-- Plot area -->
    <g transform="translate(40 86)">
      <rect width="620" height="320" rx="14" fill="#0a0915"/>
      <!-- Axis lines + grid -->
      <g stroke="rgba(178,155,255,0.18)" stroke-width="1">
        <line x1="50" y1="40" x2="50" y2="280"/>
        <line x1="50" y1="280" x2="600" y2="280"/>
        <line x1="50" y1="100" x2="600" y2="100" stroke-dasharray="2 6"/>
        <line x1="50" y1="160" x2="600" y2="160" stroke-dasharray="2 6"/>
        <line x1="50" y1="220" x2="600" y2="220" stroke-dasharray="2 6"/>
        <line x1="200" y1="40" x2="200" y2="280" stroke-dasharray="2 6"/>
        <line x1="350" y1="40" x2="350" y2="280" stroke-dasharray="2 6"/>
        <line x1="500" y1="40" x2="500" y2="280" stroke-dasharray="2 6"/>
      </g>
      <!-- Axis ticks -->
      <g fill="#7a6db8" font-family="ui-monospace, monospace" font-size="10">
        <text x="32" y="44" text-anchor="end">14.2</text>
        <text x="32" y="104" text-anchor="end">14.4</text>
        <text x="32" y="164" text-anchor="end">14.6</text>
        <text x="32" y="224" text-anchor="end">14.8</text>
        <text x="32" y="284" text-anchor="end">15.0</text>
        <text x="50" y="298" text-anchor="middle">0.0</text>
        <text x="200" y="298" text-anchor="middle">0.25</text>
        <text x="350" y="298" text-anchor="middle">0.5</text>
        <text x="500" y="298" text-anchor="middle">0.75</text>
      </g>
      <!-- Light curve sinusoid -->
      <path d="M 50 100
               C 100 240, 200 240, 250 100
               C 300 -40, 400 -40, 450 100
               C 500 240, 600 240, 600 100" fill="none" stroke="url(#varCurve)" stroke-width="3" stroke-linecap="round"/>
      <!-- Data points -->
      <g fill="#cfb8ff">
        <circle cx="80" cy="160" r="3"/>
        <circle cx="110" cy="200" r="3"/>
        <circle cx="160" cy="222" r="3"/>
        <circle cx="200" cy="200" r="3"/>
        <circle cx="240" cy="140" r="3"/>
        <circle cx="280" cy="78" r="3"/>
        <circle cx="320" cy="48" r="3"/>
        <circle cx="360" cy="72" r="3"/>
        <circle cx="410" cy="120" r="3"/>
        <circle cx="450" cy="178" r="3"/>
        <circle cx="500" cy="218" r="3"/>
        <circle cx="540" cy="194" r="3"/>
        <circle cx="580" cy="140" r="3"/>
      </g>
      <!-- Axis labels -->
      <g fill="#a8a3c8" font-family="ui-monospace, monospace" font-size="10" letter-spacing="2">
        <text x="-150" y="160" transform="rotate(-90 -150 160)">MAGNITUDE</text>
        <text x="325" y="316" text-anchor="middle">PHASE</text>
      </g>
      <!-- Legend -->
      <g transform="translate(420 30)">
        <rect width="180" height="44" rx="10" fill="rgba(178,155,255,0.1)" stroke="rgba(178,155,255,0.3)"/>
        <text x="14" y="20" font-family="ui-monospace, monospace" font-size="10" letter-spacing="2" fill="#cfb8ff">CLASS</text>
        <text x="14" y="36" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#ffffff">RR Lyrae · ab</text>
      </g>
    </g>

    <!-- Confusion matrix mini -->
    <g transform="translate(40 426)">
      <text x="0" y="0" font-family="ui-monospace, monospace" font-size="10" letter-spacing="2" fill="#cfb8ff">CONFUSION · 4-CLASS</text>
      <g transform="translate(0 10)">
        <g>
          <rect x="0" y="0" width="44" height="36" rx="6" fill="rgba(178,155,255,0.7)"/>
          <text x="22" y="22" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#070c17">128</text>
          <rect x="48" y="0" width="44" height="36" rx="6" fill="rgba(178,155,255,0.2)"/>
          <text x="70" y="22" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#cfb8ff">4</text>
          <rect x="96" y="0" width="44" height="36" rx="6" fill="rgba(178,155,255,0.16)"/>
          <text x="118" y="22" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#cfb8ff">2</text>
          <rect x="144" y="0" width="44" height="36" rx="6" fill="rgba(178,155,255,0.12)"/>
          <text x="166" y="22" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#cfb8ff">1</text>
        </g>
        <g transform="translate(0 40)">
          <rect x="0" y="0" width="44" height="36" rx="6" fill="rgba(178,155,255,0.2)"/>
          <text x="22" y="22" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#cfb8ff">3</text>
          <rect x="48" y="0" width="44" height="36" rx="6" fill="rgba(178,155,255,0.7)"/>
          <text x="70" y="22" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#070c17">94</text>
          <rect x="96" y="0" width="44" height="36" rx="6" fill="rgba(178,155,255,0.18)"/>
          <text x="118" y="22" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#cfb8ff">5</text>
          <rect x="144" y="0" width="44" height="36" rx="6" fill="rgba(178,155,255,0.12)"/>
          <text x="166" y="22" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#cfb8ff">0</text>
        </g>
      </g>
      <g transform="translate(220 10)" font-family="ui-monospace, monospace" font-size="11" fill="#cbd5e1">
        <text>Accuracy</text>
        <text y="18" font-weight="800" font-size="20" fill="#ffffff">0.92</text>
        <text x="120" y="0" fill="#cbd5e1">F1 (macro)</text>
        <text x="120" y="18" font-weight="800" font-size="20" fill="#ffffff">0.89</text>
        <text x="260" y="0" fill="#cbd5e1">Train · Val</text>
        <text x="260" y="18" font-weight="800" font-size="20" fill="#ffffff">9.4k · 1.2k</text>
      </g>
    </g>

    <!-- Code line -->
    <g transform="translate(40 510)">
      <rect width="620" height="50" rx="10" fill="rgba(178,155,255,0.08)" stroke="rgba(178,155,255,0.22)"/>
      <text x="14" y="20" font-family="ui-monospace, monospace" font-size="11" fill="#cfb8ff">In [12]:</text>
      <text x="14" y="38" font-family="ui-monospace, monospace" font-size="12" fill="#ffffff">model = Pipeline([("scaler", StandardScaler()), ("clf", RandomForestClassifier())])</text>
    </g>
  </g>

  <!-- Period markers -->
  <g font-family="ui-monospace, monospace" font-size="11" font-weight="700" letter-spacing="2">
    <rect x="60" y="60" width="174" height="28" rx="14" fill="rgba(178,155,255,0.12)" stroke="rgba(178,155,255,0.36)"/>
    <text x="76" y="78" fill="#cfb8ff">PERIOD 0.561d</text>
    <rect x="60" y="710" width="194" height="28" rx="14" fill="rgba(178,155,255,0.1)" stroke="rgba(178,155,255,0.28)"/>
    <text x="76" y="728" fill="#cfb8ff">JUPYTER · SCIKIT</text>
  </g>
</svg>
